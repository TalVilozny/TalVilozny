# Side image next to neofetch text (your photo).
# Add the file under assets/terminal/ — see assets/terminal/UPLOAD_YOUR_PHOTO.txt

[image]
filename = "profile-photo.png"
row = 3
col = 5
# Scale factor (ignored when target_height > 0)
size_multiplier = 0.65
# Preferred height in pixels on the terminal (sharper than a tiny multiplier)
target_height = 200
