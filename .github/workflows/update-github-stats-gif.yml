name: Update GitHub stats terminal GIF

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate_github_stats_gif.py"
      - "config/gifos/**"
      - "config/terminal_image.toml"
      - "assets/terminal/**"
      - "requirements.txt"
      - ".github/workflows/update-github-stats-gif.yml"
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  update-gif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Mona font fallback (Git LFS)
        run: |
          mkdir -p fonts
          curl -fsSL -o fonts/Inversionz.otf \
            "https://media.githubusercontent.com/media/x0rzavi/x0rzavi/main/fonts/Inversionz.otf"
          test "$(wc -c < fonts/Inversionz.otf)" -gt 10000

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate terminal GIF
        run: |
          if grep -qE "Total PRs|Merged PR|Contributions:" scripts/generate_github_stats_gif.py; then
            echo "Script still contains hidden stats lines."
            exit 1
          fi
          python scripts/generate_github_stats_gif.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional overrides (see config/gifos/):
          # GIFOS_GENERAL_COLOR_SCHEME: dracula
          # GIFOS_GENERAL_FPS: 15

      - name: Commit updated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.gif
          git diff --staged --quiet || git commit -m "chore: refresh GitHub stats terminal GIF"
          git push
